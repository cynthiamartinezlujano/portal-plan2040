<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance de Visitas por Guía · Plan 20·40</title>
<style>
:root{
  --ink:#141414; --body:#3D3D3D; --muted:#7A7A7A; --faint:#A3A3A3;
  --crema:#FFF6DE; --crema2:#FFF1C9; --fondo:#FAF8F4; --linea:#EEEAE3;
  --brand:#E81957; --brand-ink:#C1124A;
  --meta:#4E6B00; --meta-bg:#EAF3D6;
  --ritmo:#2F6FA8; --ritmo-bg:#E7F1FB;
  --camino:#946000; --camino-bg:#FFF1C9;
  --apoyo:#C1124A; --apoyo-bg:#FDE7EE;
  --sombra:0 1px 3px rgba(20,20,20,.05), 0 6px 20px rgba(20,20,20,.04);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--fondo)}
body{font-family:"Sora",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--body);
  -webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:60px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* barra superior */
.top{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top img{height:34px}
.top .tit{font-weight:800;color:var(--ink);font-size:15px;line-height:1.2}
.top .tit span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.sel{height:38px;border:1px solid var(--linea);border-radius:999px;padding:0 14px;font:600 13px inherit;
  color:var(--ink);background:#fff;font-family:inherit}
.chip-com{display:inline-flex;align-items:center;gap:8px;height:38px;border:1px solid var(--linea);border-radius:999px;
  padding:0 14px 0 8px;background:#fff;font:700 13px inherit;color:var(--ink);font-family:inherit}
.chip-com i{width:24px;height:24px;border-radius:50%;background:var(--crema);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}

/* bienvenida */
.bienv{text-align:center;padding:56px 0 30px}
.bienv h1{font-size:clamp(26px,4vw,36px);color:var(--ink);letter-spacing:-.02em;line-height:1.15}
.bienv p{color:var(--muted);margin-top:10px;font-size:15px}
.coms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px;max-width:780px;margin:34px auto 0}
.com-card{background:#fff;border:1px solid var(--linea);border-radius:26px;padding:26px 22px 22px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s;text-align:center}
.com-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,20,20,.1)}
.com-card img{width:190px;height:170px;object-fit:contain}
.com-card b{font-size:22px;color:var(--ink);letter-spacing:-.01em}
.com-card span{font-size:13px;color:var(--muted)}

/* hero */
.hero{background:var(--crema);border-radius:28px;padding:28px 30px;margin-top:22px;display:grid;
  grid-template-columns:auto 1fr auto;gap:28px;align-items:center;position:relative;overflow:hidden}
.hero .mini{font:800 11px inherit;letter-spacing:.09em;text-transform:uppercase;color:#A87400;font-family:inherit}
.hero h2{font-size:clamp(22px,3vw,30px);color:var(--ink);letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.hero h2 em{font-style:normal;color:var(--brand)}
.hero .frase{font-size:15px;color:#6b5a2e;margin-top:10px;max-width:46ch}
.hero .ilu{width:170px}
.hero .ritmo{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink)}

/* tarjetitas de resumen */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px;margin-top:16px}
.tile{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--sombra)}
.tile img{width:46px;height:46px;flex:none}
.tile b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--muted)}

/* semanas */
.bloque{background:#fff;border:1px solid var(--linea);border-radius:22px;padding:20px 22px;margin-top:16px;box-shadow:var(--sombra)}
.bloque h3{font-size:16px;color:var(--ink)}
.bloque .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.semanas{display:flex;align-items:flex-end;gap:12px;height:120px;margin-top:16px}
.sem{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.sem .bar{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#FDB813,#F5823C)}
.sem .n{font-size:12px;font-weight:700;color:var(--ink)}
.sem .et{font-size:11px;color:var(--muted)}

/* guías */
.cab-guias{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.cab-guias h3{font-size:20px;color:var(--ink);letter-spacing:-.01em}
.cab-guias p{font-size:13px;color:var(--muted);margin-top:2px}
.orden{display:inline-flex;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:3px}
.orden button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.orden button.on{background:var(--ink);color:#fff}
.guias{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(255px,100%),1fr));gap:16px;margin-top:16px}
.guia{background:#fff;border:1px solid var(--linea);border-radius:24px;padding:20px 18px 16px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;transition:transform .2s,box-shadow .2s;border-top:5px solid var(--c,#ddd)}
.guia:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,20,20,.1)}
.guia .nom{font-weight:800;color:var(--ink);font-size:15px;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.guia .cuenta{font-size:13px;color:var(--body)}
.guia .cuenta b{color:var(--ink)}
.estado{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--c);background:var(--cb)}
.guia .mini-datos{display:flex;gap:12px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.guia .mini-datos span{display:inline-flex;align-items:center;gap:4px}
.guia .mini-datos img{width:16px;height:16px}
.delta{font-size:11px;color:var(--muted)}

/* anillo */
.anillo{position:relative;display:inline-block}
.anillo svg{display:block;transform:rotate(-90deg)}
.anillo .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anillo .centro b{color:var(--ink);letter-spacing:-.03em;line-height:1}
.anillo .centro span{color:var(--muted)}

/* ventana de la guía */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.pcard{background:#fff;border:1px solid var(--linea);border-radius:22px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--sombra)}
.guia-pag{padding-top:18px}
.volver{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:6px 0;margin-bottom:10px}
.volver:hover{color:var(--ink)}
.g-cab{background:var(--crema);border-radius:28px;padding:22px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.g-cab h1{font-size:clamp(22px,3vw,28px);color:var(--ink);letter-spacing:-.02em;line-height:1.15}
.g-cab .g-meta{font-size:13px;color:#6b5a2e;margin-top:2px}
.g-cab .wa{width:auto;padding:13px 22px;margin:0}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.g-grid .pcard{margin-bottom:0;display:flex;flex-direction:column}
.numeritos{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:8px}
.numeritos.fam-nums div{background:#EEF4FA}
.numeritos.fam-nums span{color:#466a8c}
.numeritos .descansa{background:#F3EEFA}
.numeritos .descansa span{color:#6b4f8a}
.gtit{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#A87400;margin-top:18px}
.ico{width:17px;height:17px;flex:none;color:#A87400}
.gtit .ico{width:15px;height:15px}
.renglones p{display:flex;gap:9px;align-items:flex-start;margin-top:8px;font-size:14px}
.renglones p:first-child{margin-top:0}
.renglones .ico{margin-top:2px}
.numeritos div{background:var(--crema);border-radius:14px;padding:10px 8px;text-align:center}
.numeritos b{display:block;font-size:19px;color:var(--ink)}
.numeritos span{font-size:11px;color:#6b5a2e}
.ver-lista{margin-top:auto;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:11px 18px;font-weight:700;font-size:13.5px;align-self:flex-start;margin-top:16px}
.ver-lista:hover,.ver-lista.on{background:var(--ink);color:#fff}
.lista-cont{margin-top:16px;scroll-margin-top:80px}
.lista-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exportar{border:1px solid var(--linea);background:#fff;color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:12.5px}
.exportar:hover{background:var(--crema)}
.pcard h4{font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.pcard h4 img{width:24px;height:24px}
.pcard .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.resumen-g{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.resumen-g .txt{flex:1;min-width:220px}
.resumen-g .txt p{font-size:14px;margin-top:6px}
.como{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.como div{background:var(--fondo);border-radius:14px;padding:10px 6px;text-align:center}
.como b{display:block;font-size:20px;color:var(--ink)}
.como span{font-size:11px;color:var(--muted)}
.wa{width:100%;border:0;border-radius:999px;background:#25D366;color:#fff;font-weight:800;font-size:14px;padding:14px;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(37,211,102,.28)}
.wa.ok{background:var(--meta)}
.buscar{width:100%;height:40px;border:1px solid var(--linea);border-radius:999px;padding:0 16px;font:400 13.5px inherit;font-family:inherit;margin-top:12px;background:var(--fondo)}
.fam{border-top:1px dashed var(--linea);padding:12px 0 10px}
.fam:first-of-type{border-top:0}
.fam .ft{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:13.5px}
.fam .ft img{width:20px;height:20px}
.fam .ft span{font-weight:500;color:var(--muted);font-size:12px}
.nino{display:flex;align-items:center;gap:10px;padding:7px 0 7px 28px;font-size:13px}
.nino .nn{flex:1;color:var(--ink)}
.nino .nn small{display:block;color:var(--muted);font-size:11.5px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.lejos{background:var(--apoyo-bg);color:var(--apoyo)}
.tag.medio{background:var(--camino-bg);color:var(--camino)}
.tag.cerca{background:var(--ritmo-bg);color:var(--ritmo)}
.tag.noloc{background:#F2EFEA;color:var(--muted)}
.emb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--apoyo-bg);margin-top:8px;font-size:13px}
.emb b{color:var(--ink)}
.emb small{color:var(--muted);display:block;font-size:11.5px}
.vacio{text-align:center;padding:18px 10px;color:var(--muted);font-size:13.5px}
.vacio img{width:120px;display:block;margin:0 auto 8px}
.nota{font-size:12px;color:var(--muted);margin-top:10px}
.pie{font-size:11.5px;color:var(--faint);text-align:center;margin-top:34px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-size:13.5px;font-weight:600;z-index:60;animation:aparece .2s}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;text-align:center;padding:24px 18px;gap:16px}
  .hero .ilu{display:none}
  .hero .anillo{margin:0 auto}
  .hero .ritmo{justify-content:center}
  .hero .frase{margin-left:auto;margin-right:auto}
  .como{grid-template-columns:repeat(2,1fr)}
  .top .tit{display:none}
  .top .wrap{flex-wrap:nowrap;gap:8px}
  .top img{height:28px}
  .chip-com,.sel{height:34px;font-size:12px;padding:0 10px}
  .chip-com{padding-left:6px}
  .sel{max-width:150px}
}
.panel-desc{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;width:min(640px,calc(100% - 24px));
  background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:0 14px 40px rgba(20,20,20,.18);
  padding:14px 14px 14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.panel-desc>div{flex:1;min-width:220px}
.panel-desc b{display:block;color:var(--ink);font-size:13.5px}
.panel-desc span{color:var(--muted);font-size:12.5px}
.panel-desc .pd-copiar{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:11px 16px}
.panel-desc .pd-copiar.ok{background:var(--meta)}
.panel-desc .pd-cerrar{border:0;background:transparent;color:var(--muted);font-size:15px;padding:6px}
.copia-manual{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.copia-manual .cm-caja{background:#fff;border-radius:18px;padding:18px;width:min(760px,100%);display:flex;flex-direction:column;gap:10px}
.copia-manual textarea{width:100%;height:50vh;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--linea);border-radius:10px;padding:10px}
.copia-manual button{align-self:flex-end;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;padding:10px 18px}
.vivo{color:#2E7D4F;font-weight:700;white-space:nowrap}
.vivo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#35A562;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 3px rgba(53,165,98,.18)}
</style>
</head>

const META = D.umbrales[0];
const MES_N = ["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const COLORES_AV = ["#E81957","#F5823C","#E0A100","#5A9BD8","#A86BC2","#4E9A6B","#D0567A","#C9762E"];

const COM_URL = (new URLSearchParams(location.search).get("com") || "").toUpperCase();
const st = {
  com: COM_URL || leer("p2040_avance_com"), idx: D.defaultIdx, orden: leer("p2040_avance_orden") || "az", guia: null, q: "", lista: null, posEquipo: 0
};
function leer(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function guardar(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])) }
function fmt(n){ return Number(n||0).toLocaleString("es-MX") }
function pct(a,b){ return b? Math.round(1000*a/b)/10 : null }
function iniciales(n){ const p=n.split(/\s+/).filter(Boolean); return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase() }
function primerNombre(n){ return n.split(/\s+/)[0] }
/* las familias se nombran por los apellidos del niño (el código del CRM va en chiquito) */
function apellidos(n){ const p=n.split(/\s+/).filter(Boolean); return p.length>=3? p.slice(-2).join(" ") : (p[p.length-1]||""); }
function etiquetaFam(f, primerNino){
  if(f==="(sin familia)") return {t:"Sin familia asignada", cod:""};
  return {t:"Familia "+apellidos(primerNino), cod:f.replace(/^Familia\s*/,"")};
}
function colorDe(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORES_AV[h%COLORES_AV.length] }

/* días hábiles (lun–vie) del mes: los ya cubiertos por visitas capturadas (ritmo
   esperado) y los que quedan después del corte (lo que aún se puede hacer) */
function habiles(mes){
  const c=new Date(mes.corte+"T12:00:00"), dh=new Date((mes.datosHasta||mes.corte)+"T12:00:00");
  const y=c.getFullYear(), m=c.getMonth();
  let total=0, pasados=0, quedan=0;
  for(let d=1; d<=new Date(y,m+1,0).getDate(); d++){
    const w=new Date(y,m,d).getDay();
    if(w===0 || w===6) continue;
    total++;
    if(d<=dh.getDate()) pasados++;
    if(d>c.getDate()) quedan++;
  }
  return {total, pasados, quedan};
}
function diaMes(iso){ const f=new Date(iso+"T12:00:00"); return f.getDate()+" de "+MES_N[f.getMonth()+1]; }

/* estado amable: en el mes en curso se compara contra el ritmo esperado a la fecha */
function estado(vis, base, mes){
  const p = pct(vis, base);
  if(p===null) return {k:"sin", t:"Sin niños este mes", e:"🌿", c:"var(--muted)", cb:"#F2EFEA"};
  if(p >= META) return {k:"meta", t:"¡Meta cumplida!", e:"🎉", c:"var(--meta)", cb:"var(--meta-bg)"};
  if(mes.enCurso){
    const h=habiles(mes), esperado = META*h.pasados/Math.max(h.total,1);
    if(p >= esperado-5) return {k:"ritmo", t:"Va a buen ritmo", e:"🌱", c:"var(--ritmo)", cb:"var(--ritmo-bg)"};
    if(p >= esperado*0.7) return {k:"camino", t:"Va en camino", e:"🚶‍♀️", c:"var(--camino)", cb:"var(--camino-bg)"};
    return {k:"apoyo", t:"Le vendría bien un empujón", e:"🤝", c:"var(--apoyo)", cb:"var(--apoyo-bg)"};
  }
  if(p >= D.umbrales[1]) return {k:"camino", t:"Cerca de la meta", e:"🚶‍♀️", c:"var(--camino)", cb:"var(--camino-bg)"};
  return {k:"apoyo", t:"Mes con retos", e:"🤝", c:"var(--apoyo)", cb:"var(--apoyo-bg)"};
}
const PRIORIDAD = {apoyo:0, camino:1, ritmo:2, meta:3, sin:4};

function anillo(p, size, grosor, color, leyenda){
  const r=(size-grosor)/2, C=2*Math.PI*r, v=Math.max(0,Math.min(100,p||0));
  const metaAng = META/100*C;
  return `<div class="anillo" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F1ECE2" stroke-width="${grosor}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${grosor}"
        stroke-linecap="round" stroke-dasharray="${v/100*C} ${C}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#141414" stroke-opacity=".28" stroke-width="${grosor+4}"
        stroke-dasharray="2 ${C}" stroke-dashoffset="${-metaAng+1}"/>
    </svg>
    <div class="centro"><b style="font-size:${Math.round(size*.24)}px">${p===null?"—":Math.round(p)+"%"}</b>
      <span style="font-size:${Math.max(10,Math.round(size*.085))}px">${leyenda||"visitados"}</span></div></div>`;
}

function fraseEquipo(e, faltan, h, mes){
  if(e.k==="meta") return "¡Su equipo ya alcanzó la meta del mes! Es un buen momento para reconocer su trabajo 💛";
  if(!mes.enCurso) return `El mes cerró así. Faltaron ${fmt(faltan)} visitas para la meta del ${META}%.`;
  if(faltan<=0) return "¡Ya están en la meta!";
  const porDia = h.quedan? Math.ceil(faltan/h.quedan) : faltan;
  return e.k==="ritmo"
    ? `Van muy bien. Para cerrar en ${META}% faltan ${fmt(faltan)} visitas: unas ${fmt(porDia)} por día entre todo el equipo.`
    : `Aún hay tiempo: faltan ${fmt(faltan)} visitas para la meta, unas ${fmt(porDia)} por día entre todo el equipo.`;
}

      <div class="tile"><img src="${IMG.house}" alt=""><div><b>${fmt(d.bim)}</b><span>niños bimestrales descansan este mes</span></div></div>

function tagDias(p){
  if(p.s==="No localizado") return `<span class="tag noloc">Se intentó, no se encontró</span>`;
  if(p.d===null) return `<span class="tag lejos">Aún sin visitas</span>`;
  if(p.d>60) return `<span class="tag lejos">Hace ${p.d} días</span>`;
  if(p.d>35) return `<span class="tag medio">Hace ${p.d} días</span>`;
  return `<span class="tag cerca">Hace ${p.d} días</span>`;
}

function listaNinos(g){
  const sinAcentos = s=> s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const q = sinAcentos(st.q.trim());
  const pend = g.pend.filter(x=> !q || sinAcentos(x.n+" "+x.f+" "+x.l+" "+apellidos(x.n)).includes(q));
  const porFam = {};
  pend.forEach(x=>{ (porFam[x.f] = porFam[x.f] || {l:x.l, ninos:[]}).ninos.push(x) });
  return Object.entries(porFam).map(([f,o])=>{ const et=etiquetaFam(f, o.ninos[0].n); return `<div class="fam">
    <div class="ft"><img src="${IMG.house}" alt="">${esc(et.t)} <span>${esc(o.l)}${et.cod? " · "+esc(et.cod):""}</span></div>
    ${o.ninos.map(x=>`<div class="nino"><div class="nn">${esc(x.n)}<small>${x.e? esc(x.e)+" · ":""}${x.g!=="—"? "Gen. "+esc(x.g):""}</small></div>${tagDias(x)}</div>`).join("")}
  </div>`}).join("") || `<div class="vacio">Nadie coincide con “${esc(st.q)}”.</div>`;
}

/* ---------------- exportar a Excel (.xlsx real) ----------------
   Cada celda declara su tipo (texto o número): Excel no puede reinterpretar
   "5 años" como hora ni el mes como fecha, cosa que sí pasa con un CSV. */
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(archivos){            // [{nombre, texto}] → Uint8Array (sin compresión)
  const enc=new TextEncoder(), partes=[], central=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const a of archivos){
    const nom=enc.encode(a.nombre), dat=enc.encode(a.texto), c=crc32(dat);
    const cab=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),
               ...u32(c),...u32(dat.length),...u32(dat.length),...u16(nom.length),...u16(0)];
    partes.push(new Uint8Array(cab), nom, dat);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),
      ...u32(c),...u32(dat.length),...u32(dat.length),...u16(nom.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]), nom);
    off += cab.length+nom.length+dat.length;
  }
  const tamC = central.reduce((t,x)=>t+x.length,0);
  const fin = new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(archivos.length),...u16(archivos.length),
    ...u32(tamC),...u32(off),...u16(0)]);
  const todo=[...partes,...central,fin], out=new Uint8Array(todo.reduce((t,x)=>t+x.length,0));
  let i=0; for(const x of todo){ out.set(x,i); i+=x.length; } return out;
}
function xmlEsc(v){ return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""); }
function colLetra(i){ let s=""; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function xlsx(hoja, filas, anchos){
  ULTIMA_TABLA = filas;
  const sd = filas.map((f,r)=>`<row r="${r+1}">`+f.map((v,c)=>{
    const ref=colLetra(c)+(r+1), st = r===0? ' s="1"':"";
    if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v==null?"":v)}</t></is></c>`;
  }).join("")+"</row>").join("");
  const cols = "<cols>"+anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")+"</cols>";
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  return zip([
    {nombre:"[Content_Types].xml", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {nombre:"_rels/.rels", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {nombre:"xl/workbook.xml", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(hoja.slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {nombre:"xl/_rels/workbook.xml.rels", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {nombre:"xl/styles.xml", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFF1C9"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" fillId="2" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    {nombre:"xl/worksheets/sheet1.xml", texto:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${sd}</sheetData><autoFilter ref="A1:${colLetra(filas[0].length-1)}${filas.length}"/></worksheet>`},
  ]);
}
function edadLarga(e){ return String(e||"").replace(/ a$/," años").replace(/ m$/," meses").replace(/^1 años$/,"1 año").replace(/^1 meses$/,"1 mes"); }
function fechaLarga(iso){ if(!iso) return ""; const f=new Date(iso+"T12:00:00"); return f.getDate()+" "+MES_N[f.getMonth()+1].slice(0,3)+" "+f.getFullYear(); }
function filasNinos(g, d, mes){
  return g.pend.map(x=>{ const et=etiquetaFam(x.f, x.n); return [d.nombre, g.nombre, mes.label, et.t, et.cod, x.l, x.n,
    edadLarga(x.e), x.g==="—"? "" : (isNaN(+x.g)? x.g : +x.g), x.s, x.u? fechaLarga(x.u) : "Sin visitas registradas",
    x.d===null? "" : x.d]; });
}
const CAB_NINOS = ["Comunidad","Guía","Mes","Familia","Código familia","Localidad","Niño","Edad","Generación","Estado","Última visita","Días desde la última visita"];
const ANCHO_NINOS = [16,26,16,28,14,18,34,11,12,14,22,14];
/* SharePoint muestra los HTML dentro de un marco que BLOQUEA las descargas. Por eso,
   además de intentar descargar el .xlsx, se ofrece copiar la misma lista (columnas
   separadas por tabulador) para pegarla directo en Excel. */
let ULTIMA_TABLA = null;
/* el portal recibe el archivo y lo descarga él (afuera del marco de SharePoint);
   solo se le manda a la dirección del portal, nunca a otra página */
const PORTALES = ["https://cynthiamartinezlujano.github.io", "http://localhost:8127"];
let ESPERA_PORTAL = null;
window.addEventListener("message", e=>{
  if(!PORTALES.includes(e.origin) || !e.data || e.data.tipo!=="p2040-descarga-ok" || !ESPERA_PORTAL) return;
  if(e.data.id!==ESPERA_PORTAL.id) return;
  clearTimeout(ESPERA_PORTAL.t); const n=ESPERA_PORTAL.nombre; ESPERA_PORTAL=null;
  document.querySelectorAll(".panel-desc").forEach(x=>x.remove());
  toast("✓ Excel descargado · " + n);
});
function descargaLocal(nombre, bytes){
  try{
    const url = URL.createObjectURL(new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a = document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){}
}
function descargar(nombre, bytes){
  // abierto suelto, o dentro del Portal con contraseña (ahí el marco no bloquea): descarga normal
  if(window.top===window || location.protocol==="blob:"){ descargaLocal(nombre, bytes); return; }
  const id = Date.now()+"-"+Math.random().toString(36).slice(2);
  /* si el navegador dice quién está arriba, solo se le manda al portal si de verdad es él */
  const arriba = (location.ancestorOrigins && location.ancestorOrigins.length)
    ? location.ancestorOrigins[location.ancestorOrigins.length-1] : null;
  for(const o of PORTALES){ if(arriba && arriba!==o) continue; try{ window.top.postMessage({tipo:"p2040-descarga", id, nombre, bytes}, o); }catch(e){} }
  toast("Preparando tu Excel…");
  ESPERA_PORTAL = {id, nombre, t: setTimeout(()=>{ ESPERA_PORTAL=null; descargaLocal(nombre, bytes); panelCopiar(nombre); }, 1500)};
}
function tablaTSV(filas){
  return filas.map(f=> f.map(v=> String(v==null?"":v).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");
}
function panelCopiar(nombre){
  document.querySelectorAll(".panel-desc").forEach(e=>e.remove());
  if(!ULTIMA_TABLA) return;
  const n = ULTIMA_TABLA.length-1;
  const p = document.createElement("div"); p.className="panel-desc";
  p.innerHTML = `<div><b>⬇️ Descargando «${esc(nombre)}»</b>
      <span>¿No se descargó? Pasa al abrir el reporte desde SharePoint. Copia la lista y pégala en Excel: las columnas quedan separadas.</span></div>
    <button class="pd-copiar">📋 Copiar lista (${fmt(n)} ${n===1?"fila":"filas"})</button>
    <button class="pd-cerrar" title="Cerrar">✕</button>`;
  p.querySelector(".pd-cerrar").onclick = ()=> p.remove();
  p.querySelector(".pd-copiar").onclick = ()=> copiarTabla(p);
  document.body.appendChild(p);
}
function copiarTabla(p){
  const t = tablaTSV(ULTIMA_TABLA);
  const listo = ()=>{ const b=p && p.querySelector(".pd-copiar"); if(b){ b.textContent="✓ Copiada · pégala en Excel (⌘V / Ctrl+V)"; b.classList.add("ok"); } };
  const a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.position="fixed"; a.style.opacity="0";
  document.body.appendChild(a); a.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  a.remove();
  if(ok){ listo(); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(listo, ()=>copiaManual(t));
  } else copiaManual(t);
}
/* último recurso: la lista seleccionada en pantalla para copiar con el teclado */
function copiaManual(t){
  document.querySelectorAll(".copia-manual").forEach(e=>e.remove());
  const m=document.createElement("div"); m.className="copia-manual";
  m.innerHTML=`<div class="cm-caja"><b>Copia la lista con ⌘C (Mac) o Ctrl+C (Windows) y pégala en Excel</b>
    <textarea readonly></textarea><button>Cerrar</button></div>`;
  const ta=m.querySelector("textarea"); ta.value=t;
  m.querySelector("button").onclick=()=>m.remove();
  document.body.appendChild(m); ta.focus(); ta.select();
}
function exportar(cual){
  const mes = mesActual(), d = datosCom(), g = d.guias[st.guia];
  if(cual==="ninos"){
    descargar(`Niños por visitar - ${g.nombre} - ${mes.label}.xlsx`,

      ...g.emb_pend.map(x=>[d.nombre, g.nombre, mes.label, x.n, x.post?"Posparto":"Embarazada", x.sdg||"", fechaLarga(x.fpp), x.post?"":(x.ficha?"Sí":"No"), x.s])],
      [16,26,16,34,14,12,22,14,22]));

}
function exportarEquipo(){

function copiarWA(){

  const ok = ()=>{ toast("Mensaje copiado · pégalo en WhatsApp 💬"); const b=document.querySelector(".wa"); if(b){ b.classList.add("ok"); b.textContent="✓ Copiado"; } };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(ok, ()=>respaldo(t,ok)); }
  else respaldo(t, ok);
}
function respaldo(t, ok){
  const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0";
  document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); ok(); }catch(e){ prompt("Copia el mensaje:", t); } a.remove();
}
function toast(t){ const e=document.createElement("div"); e.className="toast"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2400); }

/* ---------------- visitas en vivo (solo en el Portal con contraseña: D.gw) ----------------
   El gateway dice qué niños y mamás ya tienen visita este mes; aquí solo se pasan de
   «por visitar» a «visitados» y se vuelven a sumar los totales. Las reglas (base del mes,
   bimestrales, embarazadas) siguen siendo las de la foto del día: no se duplican. */
const VIVO = {hora:null, nuevos:0, pendiente:false};
const FOTO_MES = D.gw ? JSON.stringify(D.meses.find(m=>m.enCurso) || null) : null;
function capturadas(mes){
  if(!mes.enCurso) return "";
  if(VIVO.hora) return ` · <span class="vivo"><i></i>visitas en vivo ${esc(VIVO.hora)}</span>`;
  return " · visitas capturadas al "+diaMes(mes.datosHasta||mes.corte);
}
function aplicarVivo(P){
  const i = D.meses.findIndex(m=>m.enCurso);
  if(i<0 || !FOTO_MES) return 0;
  const mes = JSON.parse(FOTO_MES);      // siempre se parte de la foto: aplicar dos veces da lo mismo
  let nuevos=0, maxDia=0;
  for(const c in mes.coms){
    const d = mes.coms[c]; let dv=0, df=0, de=0;
    for(const g of d.guias){
      const famAntes = g.fam_vis, quedan = [];
      for(const p of g.pend){
        const x = P[p.i];
        if(x && x.mes){
          g.visitados++; dv++;
          if(x.mes.tipo==="Presencial") g.pres++; else if(x.mes.tipo==="Telefónica") g.tel++; else g.reg++;
          if(p.s==="No localizado") g.noloc--;
          maxDia = Math.max(maxDia, parseInt(x.mes.f,10)||0);
        } else {
          if(x && x.intentos && p.s!=="No localizado"){ p.s="No localizado"; g.noloc++; }
          quedan.push(p);
        }
      }
      g.pend = quedan;
      const pf = {}; quedan.forEach(p=>{ if(p.k) pf[p.k]=(pf[p.k]||0)+1; });
      const ks = Object.keys(pf), tot = g.famn||{};
      g.fam_vis = g.fam - ks.length;
      g.fam_parcial = ks.filter(k=> pf[k] < (tot[k]||pf[k])).length;
      df += g.fam_vis - famAntes;
      g.bim_vis += (g.bim_pend||[]).filter(id=> P[id] && P[id].mes).length;
      g.emb_pend = g.emb_pend.filter(e=>{
        const x = P[e.i];
        if(x && x.mes){ g.emb_vis++; de++; return false; }
        if(x && x.intentos) e.s = "No localizada";
        return true;
      });
    }
    d.visitados += dv; d.fam_vis += df; d.emb_vis += de; nuevos += dv;
  }
  // el ritmo esperado se mide al día de la visita más reciente que ya está capturada
  const dh = new Date((mes.datosHasta||mes.corte)+"T12:00:00").getDate();
  if(maxDia > dh) mes.datosHasta = (mes.datosHasta||mes.corte).slice(0,8) + String(maxDia).padStart(2,"0");
  D.meses[i] = mes;
  return nuevos;
}
const hexABytes = h => new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
async function visitasEnVivo(){
  const G = D.gw;
  if(!G || !G.url || !(window.crypto && crypto.subtle)) return;
  try{
    const t = Math.floor(Date.now()/1000);
    const k = await crypto.subtle.importKey("raw", hexABytes(G.llave), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
    const f = await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(`${G.slug}|${t}`));
    const firma = [...new Uint8Array(f)].map(b=>b.toString(16).padStart(2,"0")).join("");
    const ctl = new AbortController(), reloj = setTimeout(()=>ctl.abort(), 12000);
    const r = await fetch(`${G.url}/visitas?guia=${encodeURIComponent(G.slug)}&t=${t}&firma=${firma}`,
      {signal: ctl.signal, cache:"no-store", headers:{"ngrok-skip-browser-warning":"1"}});
    clearTimeout(reloj);
    if(!r.ok) return;
    const R = await r.json();
    VIVO.nuevos = aplicarVivo(R.personas||{});
    VIVO.hora = R.hora || "";
    // no se repinta mientras alguien escribe en un buscador (perdería lo escrito)
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) VIVO.pendiente = true; else pintar();
  }catch(e){ /* sin señal o gateway apagado: se queda la foto del día */ }
}
if(D.gw){
  visitasEnVivo();
  setInterval(visitasEnVivo, 5*60*1000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) visitasEnVivo(); });
  document.addEventListener("focusout", ()=>{ if(VIVO.pendiente){ VIVO.pendiente=false; setTimeout(pintar, 200); } });
}

function pintar(){
  if(st.com && !mesActual().coms[st.com]) st.com=null;
  const unica = Object.keys(mesActual().coms);      // quien solo ve una comunidad entra directo
  if(!st.com && unica.length===1) st.com = unica[0];
  if(st.com && st.guia!==null){   // al cambiar de mes, la misma guía (si existe ese mes)
    const i = datosCom().guias.findIndex(x=>x.nombre===st.guiaNom);
    st.guia = i>=0? i : null;
  }
  const cuerpo = !st.com? vistaBienvenida() : (st.guia!==null? vistaGuia() : vistaCom());
  document.getElementById("app").innerHTML = barra() + cuerpo;
}
pintar();
